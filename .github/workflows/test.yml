name: Test

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Linting
        run: npm run eslint
      - name: Test
        run: npm test
